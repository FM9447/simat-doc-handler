# Automated Android APK Build & Firebase App Distribution CI/CD Pipeline
name: Build & Distribute Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android_release.yml'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'New build from CI'

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build-and-distribute:
    name: Build APK & Firebase App Distribution
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Java ─────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Flutter ──────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ── 4. Get dependencies ───────────────────────────────────────────
      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      # ── 5. Build release APK ──────────────────────────────────────────
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi

      # ── 6. Rename APK with version + date ─────────────────────────────
      - name: Rename APKs
        working-directory: flutter_app
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/DocTransit-arm64-${DATE}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/DocTransit-arm32-${DATE}.apk
          cp build/app/outputs/flutter-apk/app-release.apk             dist/DocTransit-universal-${DATE}.apk
          echo "APK_DATE=${DATE}" >> $GITHUB_ENV

      # ── 7. Upload APK as GitHub artifact (30-day download link) ───────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTransit-APK-${{ env.APK_DATE }}
          path: flutter_app/dist/
          retention-days: 30

      # ── 8. Distribute via Firebase App Distribution ───────────────────
      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          releaseNotes: ${{ github.event.inputs.release_notes || format('Auto build — {0}', github.event.head_commit.message) }}
          file: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
